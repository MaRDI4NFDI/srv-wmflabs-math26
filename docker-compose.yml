name: beta
services:
  mathoid:
    container_name: mathoid
    image: docker-registry.wikimedia.org/repos/mediawiki/services/mathoid:latest
    restart: always
    # For the Cloud VPS web proxy, see infra/main.tf.
    ports:
      - 10044:10044
  database:
    container_name: db
    image: mariadb:lts
    # The default of 128M is far too small to merge the formulae of all wikis.
    # MariaDB does not size it by the available memory yet (MDEV-36197).
    # The exported JSON files are single values of several hundred MB.
    command: --innodb-buffer-pool-size=6G --max-allowed-packet=1G
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_USER: wiki
      MARIADB_PASSWORD_FILE: /run/secrets/db_wiki_password
    volumes:
      - mw-database:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ${PROJECT_DATA:-/data/project}/backup:/backup:ro
    secrets:
      - db_root_password
      - db_wiki_password
  mediawiki:
    image: ghcr.io/mardi4nfdi/apache-assets:1.48
    restart: always
    container_name: mw
    ports:
      - 8080:80
    volumes:
      - mw-images:/var/www/html/w/images
      - mw-cache:/cache
      - ./LocalSettings.php:/shared/LocalSettings.php:ro
      - ./LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
      - ./LocalSettings.d:/shared/LocalSettings.d:ro
      - ./LocalSettings.d:/var/www/html/w/LocalSettings.d:ro
    environment:
      WIKIBASE_HOST: mediawiki-fpm
      MATH_DOMAIN: ${MATH_DOMAIN:-beta.math.wmflabs.org}
    secrets:
      - db_wiki_password
      - wg_secret_key
      - wg_upgrade_key
  mediawiki-fpm:
    image: ghcr.io/mardi4nfdi/wikibase:1.48
    container_name: mediawiki-fpm
    restart: unless-stopped
    volumes:
      - mw-images:/var/www/html/w/images
      - mw-cache:/cache
      - ./LocalSettings.php:/shared/LocalSettings.php:ro
      - ./LocalSettings.php:/var/www/html/w/LocalSettings.php:ro
      - ./LocalSettings.d:/shared/LocalSettings.d:ro
      - ./LocalSettings.d:/var/www/html/w/LocalSettings.d:ro
      - ${PROJECT_DATA:-/data/project}/wdump/math-qid:/var/www/html/math-qid:ro
      - ${PROJECT_DATA:-/data/project}/wdump/math:/data/project/wdump/math
      - ./container-scripts/mw:/var/www/html/scripts:ro
    environment:
      MATH_DOMAIN: ${MATH_DOMAIN:-beta.math.wmflabs.org}
    secrets:
      - db_wiki_password
      - wg_secret_key
      - wg_upgrade_key
      - wiki_admin_password
  # Updates the images within their pinned versions.
  watchtower:
    image: nickfedor/watchtower:1
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
  # Renders MathML to SVG on demand, see wmcloud/README.md in wikiFilter.
  svg-render:
    image: docker-registry.wikimedia.org/releng/node22-test-browser:22.22.2-s1
    profiles: [ "svg" ]
    entrypoint: [ "node" ]
    working_dir: /work
    volumes:
      - ~/wikiFilter/wmcloud/svg:/app
      - ~/Math:/math:ro
      - ${PROJECT_DATA:-/data/project}/wdump/math/svgtest:/work
# Generated on the server by infra/deploy.
secrets:
  db_root_password:
    file: secret/db_root_password.txt
  db_wiki_password:
    file: secret/db_wiki_password
  wg_secret_key:
    file: secret/wg_secret_key
  wg_upgrade_key:
    file: secret/wg_upgrade_key
  wiki_admin_password:
    file: secret/wiki_admin_password
volumes:
  mw-images:
  mw-database:
  mw-cache:
