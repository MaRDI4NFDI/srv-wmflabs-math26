"grp3" "gpe,gu,gv,ha,hak,haw,he,hi,hif,hr,hsb,ht,hu,hy,hyw,ia,iba,id,ie,ig,ilo,incubator,inh,io,is,it,ja,jam,jbo,jv,ka,kaa,kab,kbd,kcg,kg,kge,ki,kk,kl,km,kn,knc,ko,krc,ks,ksh,ku,kv,kw"
"grp4" "ky,la,labs,lad,lb,lbe,lez,lfn,lg,li,lij,lld,lmo,ln,lo,logoc,lrc,lt,ltg,lv,mad,mai,map_bms,mediawiki,meta,mg,mhr,mi,min,mk,ml,mn,mni,mnw,mo,mr,mrj,ms,mt,mwl,my,myv,mzn,nah,nap,nds,nds_nl,ne,new,nia"
"grp5" "nl,nn,no,nov,nr,nrm,nso,nv,ny,olo,om,or,os,outreach,pa,pag,pam,pap,pcd,pcm,pdc,pfl,pi,pl,pms,pnb,pnt,ps,pt,pwn,qu,rm,rmy,ro,roa_rup,roa_tara,rsk,ru,rue,rw,sa,sah,sat,sc,scn,sco,sd,se,sh,shi"
"grp6" "shn,si,simple,sk,skr,sl,sm,smn,sn,so,sources,species,sq,sr,ss,st,stq,strategy,su,sv,sw,syl,szl,ta,tcy,tdd,te,test,test2,tet,tg,th,tk,tl,tly,tn,tpi,tr,ts,tt,tum,tw,ty,tyv,udm,ug,uk,ur,usability,uz"
