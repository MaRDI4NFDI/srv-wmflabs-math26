http:
  routers:
# work around letsencrypts` limits (max 50 certs, max 100 domains per cert)
{{$groups := dict "grp1" "ab,ady,af,als,alt,am,ami,an,ang,anp,ar,ary,arz,as,ast,av,avk,awa,ay,az,azb,ba,ban,bar,bat_smg,bcl,bdr,be,be_x_old,bew,bg,bh,bjn,blk,bm,bn,bo,bpy,br,bs,btm,bug,bxr,ca,cbk_zam,cdo,ce,ceb,ch"
