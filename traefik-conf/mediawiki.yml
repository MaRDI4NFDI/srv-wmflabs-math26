{{range $i, $g := $groups}}
    wiki-{{$i}}:
    {{$languages := split $g ","}}
     {{$hosts := join ".beta.physikerwelt.de`,`" $languages}}
      rule: Host(`{{$hosts}}.beta.physikerwelt.de`)
      service: mediawiki-beta@docker
      entryPoints:
       - websecure
      tls:
        certResolver: le
{{end}}
{{range $i, $g := $groups}}
    wiki-wmf-{{$i}}:
    {{$languages := split $g ","}}
     {{$hosts := join ".beta.math.wmflabs.org`,`" $languages}}
      rule: Host(`{{$hosts}}.beta.math.wmflabs.org`)
      service: mediawiki-beta@docker
      entryPoints:
       - websecure
      tls:
        certResolver: le
{{end}}
    wiki-mardi:
      rule: Host(`mardi.beta.math.wmflabs.org`)
      service: mediawiki-beta@docker
      entryPoints:
       - websecure
      tls:
        certResolver: le
