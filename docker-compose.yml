version: '3.4'

services:
  reverse-proxy:
    image: traefik
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "443:443"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - "./letsencrypt:/letsencrypt"
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-conf:/traefik-conf:ro
    labels:
      - "traefik.enable=false"
  whoami:
    # A container that exposes an API to show its IP address
    image: containous/whoami
  mathoid:
    container_name: mathoid
    image: docker-registry.wikimedia.org/wikimedia/mediawiki-services-mathoid:2023-05-13-192519-production
    restart: always
    labels:
      - traefik.http.routers.mathoid.rule=Host(`mathoid.beta.math.wmflabs.org`)
      - traefik.http.services.mathoid.loadbalancer.server.port=10044
      - traefik.http.routers.mathoid.tls=true
      - traefik.http.routers.mathoid.tls.certresolver=le
  database:
    container_name: db
    image: mariadb:10.8.2 #See https://stackoverflow.com/a/72417962
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - mw-database:/var/lib/mysql
      - ./dumps:/docker-entrypoint-initdb.d
    secrets:
      - db_root_password
    labels:
      - "traefik.enable=false"
  mediawiki:
    container_name: mw
    image: ghcr.io/mardi4nfdi/docker-wikibase:main
    restart: always
    volumes:
    - ./container-scripts/mw:/var/www/html/scripts:ro
    - ./LocalSettings.php:/shared/LocalSettings.php:ro
    - ./LocalSettings.d:/shared/LocalSettings.d:ro
    - /data/project/wdump/math-qid:/var/www/html/math-qid:ro
    ports:
      - 8080:80
    links:
      - database
secrets:
   db_root_password:
     file: secret/db_root_password.txt
volumes:
  mw-images:
  mw-database:
